    <!-- =========================================================
         GOOGLE ANALYTICS
         
         Delayed until browser is idle so it doesn't compete
         with the initial React render.
    ========================================================== -->

    <script>
      window.addEventListener("load", function () {
        const loadAnalytics = () => {
          if (window.__cubeAnalyticsLoaded) {
            return;
          }

          window.__cubeAnalyticsLoaded = true;

          const script =
            document.createElement("script");

          script.async = true;

          script.src =
            "https://www.googletagmanager.com/gtag/js?id=G-NFEXT5X1L9";

          document.head.appendChild(script);

          window.dataLayer =
            window.dataLayer || [];

          function gtag() {
            window.dataLayer.push(arguments);
          }

          window.gtag = gtag;

          gtag(
            "js",
            new Date()
          );

          gtag(
            "config",
            "G-NFEXT5X1L9",
            {
              send_page_view: true
            }
          );
        };

        if (
          "requestIdleCallback" in window
        ) {
          requestIdleCallback(
            loadAnalytics,
            {
              timeout: 5000
            }
          );
        } else {
          setTimeout(
            loadAnalytics,
            4000
          );
        }
      });
    </script>
