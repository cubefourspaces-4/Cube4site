          document.head.appendChild(script);

          window.dataLayer =
            window.dataLayer || [];

          function gtag() {
            window.dataLayer.push(arguments);
          }

          window.gtag = gtag;

          gtag(
            "js",
            new Date()
          );

          gtag(
            "config",
            "G-NFEXT5X1L9",
            {
              send_page_view: true
            }
          );
        };

        if (
          "requestIdleCallback" in window
        ) {
          requestIdleCallback(
            loadAnalytics,
            {
              timeout: 5000
            }
          );
        } else {
